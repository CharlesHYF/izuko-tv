# 小米电视兼容构建与回归验证
# 创建日期：2026-10-22
# 修改日期：2026-10-22
name: MiTV compatibility

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build-logic/**'
      - 'tools/docker/mitv/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'Makefile'
      - '.github/workflows/mitv-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mitv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: github.repository == 'CharlesHYF/izuko-tv'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MITV_GRADLE_CACHE_DIR: ${{ github.workspace }}/.mitv-ci-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: .mitv-ci-cache
          key: mitv-gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            mitv-gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Build isolated toolchain
        run: docker build --platform linux/amd64 -t izuko-mitv-build:local tools/docker/mitv
      - name: Test settings, buffering, dependencies and APK
        run: make verify
      - name: Annotate validation failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('artifacts/mitv/build.log')
          if log.exists():
              count = 0
              for line in log.read_text(errors='replace').splitlines():
                  if line.startswith(('e:', 'Could not ', 'Execution failed', '> Could not ', '* What went wrong:')):
                      message = line.replace('%', '%25').replace('\r', '%0D')
                      print(f'::error title=MiTV validation::{message}')
                      count += 1
                      if count >= 15:
                          break
          PY
      - name: Upload build log and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitv-api23-armeabi-v7a
          path: artifacts/mitv/
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .mitv-ci-cache
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
