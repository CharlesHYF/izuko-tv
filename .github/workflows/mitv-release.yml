# 小米电视 API 23 ARM32 Release 发布与成品检查
name: Publish MiTV API23 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mitv-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mitv-api23-release
  cancel-in-progress: true
jobs:
  publish:
    if: github.repository == 'CharlesHYF/izuko-tv'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: CharlesHYF/izuko-tv
      RELEASE_TAG: mitv-api23-r8-20261023
      MITV_GRADLE_CACHE_DIR: ${{ github.workspace }}/.mitv-ci-cache
      MITV_OUTPUT_DIR: ${{ github.workspace }}/artifacts/mitv-optimized
      MITV_GRADLE_HEAP: 4g
      MITV_KOTLIN_HEAP: 1g
      MITV_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: .mitv-ci-cache
          key: mitv-gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}-release
          restore-keys: |
            mitv-gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Build isolated toolchain
        run: make docker-image
      - name: Inspect runtime dependencies
        run: |
          mkdir -p artifacts/release-report
          bash tools/docker/mitv/run.sh :app:android:dependencies --configuration defaultTvReleaseRuntimeClasspath :app:android:dependencyInsight --configuration defaultTvReleaseRuntimeClasspath --dependency antlr
          cp "$MITV_OUTPUT_DIR/build.log" artifacts/release-report/runtime-dependencies.txt
      - name: Test and build R8 release
        run: |
          bash tools/docker/mitv/run.sh :utils:ktor-client:testAndroidHostTest :app:android:auditMiTvDependencies :app:android:assembleDefaultTvRelease
          test -s "$MITV_OUTPUT_DIR/r8/mapping.txt"
      - name: Sign the ARM32 release test package
        run: |
          mkdir -p release-apk "$RUNNER_TEMP/mitv-signing"
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$MITV_OUTPUT_DIR/apk,target=/unsigned,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/mitv-signing,target=/key" \
            --mount "type=bind,source=$PWD/release-apk,target=/signed" \
            izuko-mitv-build:local bash /source/tools/docker/mitv/sign-test-release.sh > artifacts/release-report/signature.txt
      - name: Verify API23, ABI and DEX size
        run: |
          gh run download 39770675539 --name mitv-api23-armeabi-v7a --dir debug-baseline
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            izuko-mitv-build:local /opt/android-sdk/build-tools/36.0.0/aapt2 dump badging \
            /source/release-apk/izuko-tv-mitv-api23-armeabi-v7a-release.apk > artifacts/release-report/apk-badging.txt
          grep -qFx "minSdkVersion:'23'" artifacts/release-report/apk-badging.txt
          grep -qFx "native-code: 'armeabi-v7a'" artifacts/release-report/apk-badging.txt
          if grep -q '^application-debuggable' artifacts/release-report/apk-badging.txt; then exit 1; fi
          python3 tools/docker/mitv/apk-api23-report.py \
            --apk release-apk/izuko-tv-mitv-api23-armeabi-v7a-release.apk \
            --output artifacts/release-report/api23-dex-references.json
          python3 tools/docker/mitv/apk-size-report.py \
            --apk release-apk/izuko-tv-mitv-api23-armeabi-v7a-release.apk \
            --baseline debug-baseline/apk/defaultTv/debug/android-default-tv-armeabi-v7a-debug.apk \
            --output artifacts/release-report --allow-over-budget
          cat artifacts/release-report/apk-size.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish optimized APK
        run: |
          apk=release-apk/izuko-tv-mitv-api23-armeabi-v7a-release.apk
          cat > release-notes.txt <<'NOTES'
          小米电视 Android 6.0 / API 23 优化测试版。

          - Release 构建，启用 R8 和资源裁剪。
          - 实际清单 minSdk 23，仅 armeabi-v7a，API 23 v1 签名已验证。
          - 使用本次构建的测试签名；真机安装、硬解和流畅度待电视验证。
          NOTES
          cat artifacts/release-report/apk-size.md >> release-notes.txt
          printf '\nSHA-256: `%s`\n' "$(sha256sum "$apk" | cut -d ' ' -f 1)" >> release-notes.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.txt
          else
            gh release create "$RELEASE_TAG" "$apk" --target "$GITHUB_SHA" \
              --title 'MiTV API23 ARM32 Release 优化测试版' --prerelease --notes-file release-notes.txt
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mitv-r8-build-candidate
          path: release-apk/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mitv-r8-release-report
          path: |
            artifacts/release-report/
            artifacts/mitv-optimized/build.log
            artifacts/mitv-optimized/tests/
          retention-days: 7
      - name: Return cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .mitv-ci-cache
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .mitv-ci-cache
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
