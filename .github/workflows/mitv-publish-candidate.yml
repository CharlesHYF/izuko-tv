# 发布用户授权同步真机验证的优化构建
name: Publish MiTV test candidate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mitv-publish-candidate.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mitv-test-candidate-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'CharlesHYF/izuko-tv'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: CharlesHYF/izuko-tv
      SOURCE_RUN: '39779353434'
      RELEASE_TAG: mitv-api23-r8-20261022
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the optimized APK
        run: |
          gh run watch "$SOURCE_RUN" --interval 15
          gh run download "$SOURCE_RUN" --name mitv-r8-build-candidate --dir candidate
          gh run download "$SOURCE_RUN" --name mitv-r8-release-report --dir report
      - name: Check the APK and compatibility reports
        run: |
          python3 tools/docker/mitv/apk-api23-report.py \
            --apk candidate/izuko-tv-mitv-api23-armeabi-v7a-release.apk \
            --output api23-dex-references.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import zipfile
          root = Path('report/release-report')
          badging = (root / 'apk-badging.txt').read_text()
          assert "minSdkVersion:'23'" in badging.splitlines()
          assert "native-code: 'armeabi-v7a'" in badging.splitlines()
          assert 'application-debuggable' not in badging
          signature = (root / 'signature.txt').read_text()
          assert 'Verified using v1 scheme (JAR signing): true' in signature
          with zipfile.ZipFile('candidate/izuko-tv-mitv-api23-armeabi-v7a-release.apk') as archive:
              dex_bytes = sum(e.file_size for e in archive.infolist() if e.filename.startswith('classes') and e.filename.endswith('.dex') and '/' not in e.filename)
          assert 0 < dex_bytes < 166069428 / 2, 'APK must contain R8 shrunk DEX'
          print(f'Actual DEX: {dex_bytes / 1048576:.2f} MiB')
          PY
      - name: Publish for the target TV test
        run: |
          apk=candidate/izuko-tv-mitv-api23-armeabi-v7a-release.apk
          cat > notes.txt <<'NOTES'
          小米电视 API 23 / armeabi-v7a 优化测试版，供真机同步验证。

          - Release 构建，启用 R8 与资源裁剪。
          - 实际 APK 清单、ARM32、Android 6.0 v1 签名通过检查。
          - DEX 类型扫描没有 CompletableFuture 平台类型引用。
          - 使用构建任务专属测试签名；真机启动、硬解与流畅度待验证。

          NOTES
          cat report/release-report/apk-size.md >> notes.txt
          printf '\nSHA-256: `%s`\n' "$(sha256sum "$apk" | cut -d ' ' -f 1)" >> notes.txt
          source_sha="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" --clobber
            gh release edit "$RELEASE_TAG" --notes-file notes.txt
          else
            gh release create "$RELEASE_TAG" "$apk" --target "$source_sha" --prerelease \
              --title 'MiTV API23 ARM32 Release 优化测试版' --notes-file notes.txt
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
